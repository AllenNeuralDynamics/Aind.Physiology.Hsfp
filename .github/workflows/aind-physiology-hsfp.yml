name: HSFP test suite

on:
  pull_request:
  push:
    branches:
      - main
      - dev*
      - release*
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ╔──────────────────────────╗
  # │   _____         _        │
  # │  |_   _|__  ___| |_ ___  │
  # │    | |/ _ \/ __| __/ __| │
  # │    | |  __/\__ \ |_\__ \ │
  # │    |_|\___||___/\__|___/ │
  # │                          │
  # ╚──────────────────────────╝
  tests:
    runs-on: windows-latest
    name: HSFP unit tests
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check

      - name: Run codespell
        run: uv run codespell --check-filenames

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup Bonsai environment
        working-directory: ./.bonsai
        run: ./setup.ps1

      - name: Run python unit tests
        run: uv run pytest

      - name: Regenerate schemas
        run: uv run hsfp regenerate

      - name: Build
        run: uv build --all-packages

      - name: Check for uncommitted changes
        shell: bash
        run: |
          git config --global core.safecrlf false
          git diff --exit-code || (echo "Untracked changes found" && exit 1)

  # ╔───────────────────────────────────────────────────────────╗
  # │    ____      _                                             │
  # │   |  _ \ ___| | ___  __ _ ___  ___                        │
  # │   | |_) / _ \ |/ _ \/ _` / __|/ _ \                       │
  # │   |  _ <  __/ |  __/ (_| \__ \  __/                       │
  # │   |_| \_\___|_|\___|\__,_|___/\___|                       │
  # │                                                           │
  # ╚───────────────────────────────────────────────────────────╝
  prepare-release:
    runs-on: ubuntu-latest
    name: Set version and regenerate schemas
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          version=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Setting version to: $version"

      # The repository root is a uv workspace without a project of its own, so the released
      # package must be named explicitly.
      - name: Validate version tag format
        run: uv version --package aind-physiology-hsfp ${{ steps.get_version.outputs.version }} --dry-run

      - name: Set version
        run: uv version --package aind-physiology-hsfp ${{ steps.get_version.outputs.version }}

      - name: Regenerate schemas
        run: uv run hsfp regenerate

      - name: Regenerate examples
        run: uv run ./examples/example.py --path-seed "./examples/{schema}.json"

      - name: Build
        run: uv build --package aind-physiology-hsfp

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Commit version and schema changes
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Bump version and regenerate schemas [skip ci]"
          git push origin main
          git tag -fa "${{ github.event.release.tag_name }}" -m "${{ github.event.release.tag_name }}"
          git push origin "${{ github.event.release.tag_name }}" --force
